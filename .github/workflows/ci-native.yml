name: ci-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Tcl on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Install Tcl on macOS
        if: runner.os == 'macOS'
        run: |
          brew install tcl-tk
          echo "$(brew --prefix tcl-tk)/bin" >> "$GITHUB_PATH"
      - name: Use Git for Windows Tcl runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitRoot = Split-Path -Parent (Split-Path -Parent (Get-Command git).Source)
          $tclBin = Join-Path $gitRoot 'mingw64\bin'
          $tclsh = Join-Path $tclBin 'tclsh.exe'
          if (-not (Test-Path $tclsh)) {
            throw "Git for Windows Tcl runtime was not found at $tclsh"
          }
          $tclBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python3 scripts/validate_scaffold.py
