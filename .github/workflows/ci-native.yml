name: ci-native

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: sudo apt-get update && sudo apt-get install -y tcl
      - run: python3 scripts/validate_scaffold.py
