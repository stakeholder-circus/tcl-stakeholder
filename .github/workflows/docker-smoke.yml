name: docker-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t tcl-stakeholder .
      - run: docker run --rm tcl-stakeholder --list-values --output-format json
      - name: Deterministic JSON smoke
        run: |
          first=$(docker run --rm tcl-stakeholder --focus-family code-analyzer --output-format json --seed 42)
          second=$(docker run --rm tcl-stakeholder --focus-family code-analyzer --output-format json --seed 42)
          test "$first" = "$second"
      - name: Experimental provider fail-fast
        run: |
          set +e
          docker run --rm tcl-stakeholder --experimental-provider local-demo
          status=$?
          test "$status" -eq 2
