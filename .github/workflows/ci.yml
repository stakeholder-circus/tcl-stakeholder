name: ci

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Tcl on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Install Tcl on macOS
        if: runner.os == 'macOS'
        run: brew install tcl-tk
      - name: Install Tcl on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install activetcl --no-progress -y
      - name: Validate
        run: python3 scripts/validate_scaffold.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tcl-stakeholder .
      - name: Smoke test
        run: docker run --rm tcl-stakeholder --focus-family code-analyzer --output-format json --seed 42
