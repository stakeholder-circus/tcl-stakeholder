name: sast

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read

jobs:
  tclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned Tcl analyzer
        run: python -m pip install --disable-pip-version-check tclint==0.8.0
      - name: Run Tcl static analysis
        run: tclint bin/tcl-stakeholder lib tests
