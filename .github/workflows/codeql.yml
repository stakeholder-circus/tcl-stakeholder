name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "CodeQL has no Tcl analyzer; Tcl validation runs in ci.yml."
